# ---------------------------------------------------------------------------
# Deploy — every push to main that passes tests is rolled out to the
# staging VPS (cozy.erpsystemsales.com, see README "Staging-сервер").
#
# How it works: the job SSHes into the server and runs scripts/deploy.sh
# from the repo checkout there (/opt/cozy). That script fast-forwards the
# checkout, rebuilds the backend image from source with docker compose,
# restarts Caddy if its config changed, and waits for /readyz. No container
# registry is involved — the image is built on the VPS, so the server needs
# nothing beyond git + docker + its own .env.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#
#   DEPLOY_HOST      - VPS hostname or IP (95.215.244.199)
#   DEPLOY_USER      - SSH user on the VPS (root)
#   DEPLOY_SSH_KEY   - PRIVATE key of a dedicated deploy keypair (ed25519,
#                      PEM/OpenSSH text). Its public half must be in that
#                      user's ~/.ssh/authorized_keys on the VPS. Use a
#                      separate key generated just for GitHub — never the
#                      one on a developer laptop.
#   DEPLOY_PATH      - repo checkout on the VPS (/opt/cozy)
#   DEPLOY_SSH_PORT  - optional, defaults to 22
#
# Third-party actions are pinned to exact version tags (not SHAs) — same
# reasoning as in ci.yml.
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    branches:
      - main
  # Manual re-run from the Actions tab (e.g. after fixing a secret) without
  # pushing an empty commit.
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels a queued (not running)
# older one so the server always ends up on the latest main.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: vet & test before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  deploy:
    name: Deploy to staging over SSH
    needs: test
    runs-on: ubuntu-latest
    # Opens an SSH session only; needs no GITHUB_TOKEN scope at all.
    permissions: {}
    environment:
      name: staging
      url: https://cozy.erpsystemsales.com
    steps:
      - name: Run scripts/deploy.sh on the VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          # Forwarded via `envs:` rather than interpolated into `script:`,
          # so the value is not baked into the literal script text.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # Pull the script itself first so a deploy that changes
            # scripts/deploy.sh runs the NEW version, not the one already
            # on disk.
            git fetch -q origin main
            git checkout -q origin/main -- scripts/deploy.sh
            bash scripts/deploy.sh

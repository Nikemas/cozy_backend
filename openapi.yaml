openapi: 3.0.3
info:
  title: Cozy API
  description: |
    REST API for Cozy (Bishkek shoe shop) — covers `/api/v1/*` (public storefront,
    used by the Flutter app and the site's AJAX/HTMX calls) and `/admin/api/*`
    (staff-only admin panel), per §6 of `docs/Cozy — Технический ТЗ для
    разработчика.md`.

    This file documents only endpoints that actually exist in the code today —
    don't let it drift from the real route table (`internal/httpapi`,
    `internal/staff`, `internal/points`, `internal/media`).

    Online card payment (`payment_method: online_card`) goes through
    `internal/payments`. Until Bakai Bank grants API access the server runs
    with `PAYMENTS_PROVIDER=mock` (default outside `APP_ENV=prod`): the
    returned `payment_url` is a local test page that simulates the bank. With
    `PAYMENTS_PROVIDER=bakai` (the prod default) online orders are refused with
    `503 payments_not_configured` until the real integration lands.
  version: "0.6.0"

servers:
  - url: http://localhost:8080
    description: Local dev (see cozy_backend/README.md)

tags:
  - name: Auth
    description: Customer login via SMS OTP (Nikita SMSPro) — see §5 ТЗ.
  - name: Catalog
    description: Public, unauthenticated read-only catalog.
  - name: Customer
    description: Mobile/JSON API for a logged-in customer (favorites, addresses, devices, orders, cart) — JWT bearer, see §6 ТЗ.
  - name: Payments
    description: Payment provider callbacks and the mock provider's test checkout page.
  - name: Admin — Staff
    description: Staff login/logout (server-side session cookie) and staff-account CRUD (owner only).
  - name: Admin — Catalog
    description: Write side of the catalog, RBAC-gated (owner/manager, stock also point_staff).
  - name: Admin — Media
    description: Product photo upload (server-side normalization into full/thumb variants).
  - name: Admin — Points
    description: Points-of-sale CRUD, owner only.
  - name: Admin — Orders
    description: Order management (list/detail/status), point-scoped for point_staff.
  - name: Admin — Reports
    description: Sales reports, JSON + Excel export, owner/manager only.
  - name: Admin — Import
    description: Bulk product import from CSV/Excel.
  - name: System
    description: Liveness/readiness probes.

security: []

paths:
  # ---------------------------------------------------------------- Auth ---
  /api/v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: Request an SMS OTP code
      description: |
        Validates the phone number, rate-limits the request, then asks Nikita
        SMSPro to text a one-time code. Always returns 200 regardless of
        whether the phone belongs to an existing customer, so the response
        can't be used to enumerate customers.

        Limits, checked atomically under a per-phone lock:
        - per phone: one request per 60 s (`otp_cooldown`), 5 per hour (`otp_rate_limited`);
        - per client IP: `OTP_MAX_PER_IP_PER_HOUR` per hour, default 30 (`otp_rate_limited`);
        - all phones together: `OTP_MAX_PER_DAY` per rolling 24 h, default 1000 (`otp_daily_limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Kyrgyz mobile number, any of `+996XXXXXXXXX`, `996XXXXXXXXX`, or local `0XXXXXXXXX`.
                  example: "+996700123456"
      responses:
        "200":
          description: Code sent (or, from the caller's point of view, request accepted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: sent }
        "400":
          description: Malformed phone number.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "429":
          description: |
            `otp_cooldown` (60 s per phone), `otp_rate_limited` (phone or IP
            hourly cap) or `otp_daily_limit` (global SMS ceiling — SMS login is
            temporarily unavailable for everyone).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "502":
          description: Nikita SMSPro unreachable or returned an unexpected status.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: Nikita SMSPro account out of funds (`sms_provider_out_of_funds`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an SMS OTP code and receive tokens
      description: |
        Verifies the code against the active OTP transaction for the phone.
        On success, gets-or-creates the customer record and issues an access
        token (JWT HS256, 15 min TTL) and a refresh token (opaque, 30 days TTL,
        stored server-side hashed), plus the customer's profile so the app
        needs no extra `GET /api/v1/customer` right after login.

        Each sent code allows `OTP_VERIFY_MAX_ATTEMPTS` attempts (default 5);
        the last wrong one burns the code (`otp_attempts_exceeded`, request a
        new code). Wrong codes are also counted per client IP
        (`OTP_VERIFY_MAX_FAILS_PER_IP_PER_HOUR`, default 30). A code logs in
        only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "+996700123456" }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Verified — token pair issued.
          content: { application/json: { schema: { $ref: "#/components/schemas/VerifyOTPResponse" } } }
        "400":
          description: Malformed phone, or `otp_expired` (no active code — expired, used or burned) / `otp_invalid` (wrong code).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "429":
          description: "`otp_attempts_exceeded` — too many wrong codes for this code or from this IP."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "502":
          description: Nikita SMSPro unreachable.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token for a new token pair
      description: |
        The presented refresh token is retired atomically and a new
        access+refresh pair is issued in the same session ("token family").

        **Reuse detection:** presenting a refresh token that was already
        rotated revokes the whole family — every token of that login — and
        answers 401 `refresh_invalid`; the app must log in again. The client
        must therefore never send the same refresh token twice (serialize
        refreshes; don't retry a refresh whose response was lost with the old
        token — log in again instead).

        Rate-limited per client IP (`AUTH_REFRESH_MAX_PER_IP_PER_MINUTE`,
        default 120). A 429 is NOT a reason to log the user out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair issued.
          content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }
        "401":
          description: "`refresh_invalid` — unknown, expired, revoked (logout, account deleted) or reused token."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "429":
          description: "`refresh_rate_limited` — retry later, keep the session."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out — revoke a refresh token's session
      description: |
        Revokes the refresh token's whole session (token family). No access
        token needed. Idempotent: always 204, also for an unknown, expired or
        already-revoked token or an empty body. Call `DELETE /api/v1/devices`
        (with the access token) before this to stop pushes to the device.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out (or nothing to do). }

  # ------------------------------------------------------------- Catalog ---
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Category tree
      responses:
        "200":
          description: Root categories, each with nested `children`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /api/v1/products:
    get:
      tags: [Catalog]
      summary: List products
      description: Only `is_active = true` products are returned.
      parameters:
        - name: category
          in: query
          description: Category `id` (UUID) or `slug`.
          schema: { type: string }
        - name: size
          in: query
          schema: { type: string }
        - name: color
          in: query
          schema: { type: string }
        - name: price_min
          in: query
          schema: { type: number, format: double }
        - name: price_max
          in: query
          schema: { type: number, format: double }
        - name: q
          in: query
          description: Free-text search against `name_ru`/`name_ky` (`ILIKE`).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc], default: newest }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Paginated product list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400":
          description: Malformed `price_min`/`price_max`/`sort`/`page`, or unknown `category`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/products/{id}:
    get:
      tags: [Catalog]
      summary: Product detail — variants + per-point stock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product with its variants and stock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetailResponse" }
        "404":
          description: "`product_not_found` — missing or inactive (identical response either way)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # -------------------------------------------------------- Customer API ---
  /api/v1/favorites:
    get:
      tags: [Customer]
      summary: List favorited products
      description: |
        Returns full `Product` objects (not bare IDs) — the mobile favorites
        screen needs to render cards directly. A product that's since gone
        inactive/deleted is silently skipped rather than failing the request.
      security: [{ customerBearerAuth: [] }]
      responses:
        "200":
          description: Favorited products.
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Product" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/favorites/{productId}:
    post:
      tags: [Customer]
      summary: Add a product to favorites
      description: Idempotent — favoriting an already-favorited product succeeds again.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Added (or already present). }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Customer]
      summary: Remove a product from favorites
      description: Idempotent — removing a product that was never favorited also succeeds.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Removed (or already absent). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/addresses:
    get:
      tags: [Customer]
      summary: List the customer's saved delivery addresses
      security: [{ customerBearerAuth: [] }]
      responses:
        "200":
          description: Default address first, then newest first.
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Address" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Customer]
      summary: Create a delivery address
      security: [{ customerBearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "400":
          description: "`invalid_address` — blank `address_text`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/addresses/{id}:
    put:
      tags: [Customer]
      summary: Update a delivery address
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`address_not_found` — missing, or belongs to a different customer (indistinguishable)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    delete:
      tags: [Customer]
      summary: Delete a delivery address
      description: Blocked (`409 address_in_use`) if the address is referenced by a past order.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`address_not_found` — missing, or belongs to a different customer (indistinguishable)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/devices:
    post:
      tags: [Customer]
      summary: Register an FCM push-notification device token
      description: |
        Upsert by `fcm_token` (globally unique): if the token was previously
        registered to a different customer (app reinstall, account switch on
        the same device), ownership moves to the current customer rather
        than erroring.
      security: [{ customerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token, platform]
              properties:
                fcm_token: { type: string }
                platform: { type: string, enum: [ios, android] }
      responses:
        "204": { description: Registered. }
        "400":
          description: Invalid `platform`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Customer]
      summary: Unregister an FCM device token
      description: |
        Removes the token if it belongs to the current customer (call it on
        logout, before `POST /api/v1/auth/logout`). Idempotent: 204 also when
        the token is unknown, belongs to someone else, or is empty.
        `fcm_token` is accepted as an alias of `token`.
      security: [{ customerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Unregistered (or nothing to do). }
        "400":
          description: Body is not JSON.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/customer:
    get:
      tags: [Customer]
      summary: The logged-in customer's profile
      security: [{ customerBearerAuth: [] }]
      responses:
        "200":
          description: Profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/CustomerProfile" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`customer_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    put:
      tags: [Customer]
      summary: Update the logged-in customer's profile (partial)
      description: |
        Partial update: every field is optional and an absent field is left
        unchanged — e.g. `{"promo_push": false}` from the "Акции и скидки"
        switch, or `{"lang": "ky"}` when the app language changes. An empty
        object changes nothing and returns the current profile.
      security: [{ customerBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, example: "Айбек" }
                lang: { type: string, enum: [ru, ky], description: "Language of order-status and promo pushes." }
                promo_push: { type: boolean, description: "Receive promo broadcasts (default true). Order-status pushes are not affected." }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/CustomerProfile" } } }
        "400":
          description: "`invalid_name` — blank/too long name; `invalid_lang` — lang not `ru`/`ky`; `bad_request` — malformed JSON."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Customer]
      summary: Delete the logged-in customer's account
      description: |
        Account deletion (App Store / Google Play requirement). In one
        transaction: deletes the cart, favorites, device tokens and saved
        addresses (addresses referenced by past orders are kept, without their
        label, as part of the order record); revokes all refresh tokens; and
        anonymizes the customer (phone and name removed). Orders are kept for
        accounting. The phone number can register again as a new customer.
        The current access token stays technically valid until it expires
        (≤15 min) — the app should drop both tokens right away.

        Refused with 409 `has_active_orders` while any order is not yet
        `delivered` or `cancelled`. Repeating the call is a no-op (204).
      security: [{ customerBearerAuth: [] }]
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`has_active_orders` — finish or cancel the orders first."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/points:
    get:
      tags: [Catalog]
      summary: Points of sale (self-pickup locations)
      description: "Public, unauthenticated; served with `Cache-Control: public, max-age=60`."
      responses:
        "200":
          description: Active points of sale.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        address: { type: string }

  /api/v1/app/config:
    get:
      tags: [System]
      summary: Mobile app version gate
      description: |
        Public, unauthenticated. The Flutter app reads it at startup: below
        `min_version` → force update, below `latest_version` → suggest one.
        Values come from env (`APP_MIN_VERSION`, `APP_LATEST_VERSION`,
        default `1.0.0`; `APP_STORE_URL_IOS`, `APP_STORE_URL_ANDROID`,
        default empty string). Served with `Cache-Control: public, max-age=300`.
        `delivery_fee` is the flat delivery charge in som (`DELIVERY_FEE_SOM`,
        default 200) that the server adds to `total_amount` of every
        delivery order; self-pickup is free.
      responses:
        "200":
          description: Current version policy.
          content:
            application/json:
              schema:
                type: object
                required: [min_version, latest_version, store_url_ios, store_url_android, delivery_fee]
                properties:
                  min_version: { type: string, example: "1.0.0" }
                  latest_version: { type: string, example: "1.0.0" }
                  store_url_ios: { type: string, example: "" }
                  store_url_android: { type: string, example: "" }
                  delivery_fee: { type: number, format: double, example: 200, description: "Som added to a delivery order's total (DELIVERY_FEE_SOM)." }

  /api/v1/orders:
    post:
      tags: [Customer]
      summary: Place an order
      description: |
        Server recomputes every line's price/product-name/size/color from the
        current catalog inside the same transaction that locks and decrements
        stock (`SELECT ... FOR UPDATE`, sorted variant-id lock order to avoid
        cross-order deadlocks) — the client only supplies `variant_id`/
        `quantity`. Exactly one of `address_id` (delivery) or
        `pickup_point_id` (self-pickup) must be set; for delivery, the
        fulfilling point of sale is chosen automatically (first active point
        whose stock covers every line).

        `payment_method` (default `cash_on_delivery`):
        - `cash_on_delivery` — as before; no `payment_status`/`payment_url`.
        - `online_card` — stock is reserved the same way, a `pending` payment
          is created in the same transaction, then a checkout session is
          opened with the active provider. The response carries
          `payment_url`: open it (WebView/browser) for the customer to pay;
          afterwards poll `GET /api/v1/orders/{id}` for `payment_status`. If
          the payment fails or is cancelled, the order is cancelled
          automatically and its stock returned; place a new order to retry.
          A payment still `pending` after `PAYMENT_PENDING_TTL` (default 30m)
          is cancelled by a background job the same way. Staff are notified
          (Telegram) about an `online_card` order only once it is paid; a
          `cash_on_delivery` order is announced right away.

        **Delivery fee.** A delivery order (`address_id`) gets
        `delivery_fee` = `DELIVERY_FEE_SOM` (see `GET /api/v1/app/config`),
        included in `total_amount` (and in the online payment amount).
        Self-pickup: `delivery_fee` = 0.

        **Idempotency.** Send an `Idempotency-Key` header (≤ 64 printable
        ASCII chars, e.g. a UUID generated once per checkout attempt and
        reused on retries). A repeat with the same key by the same customer
        within 24 h returns the order the first request created with
        **200** (instead of 201) and creates nothing — for `online_card`,
        `payment_url` is returned again while the payment is still pending.
        If the first attempt failed (no order was created, or opening the
        payment failed), the retry places a new order.

        **Limits.** At most 20 of one variant per order (`qty_too_large`);
        a customer may have at most `MAX_OPEN_ORDERS_PER_CUSTOMER`
        (default 5) orders in `placed`/`confirmed`/`courier_assigned` at
        once (`too_many_open_orders`).
      security: [{ customerBearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
          description: Client-generated key that makes retries of the same checkout safe (see above).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrderCreateRequest" } } }
      responses:
        "201": { description: Order placed., content: { application/json: { schema: { $ref: "#/components/schemas/OrderCreateResponse" } } } }
        "200": { description: "Idempotent replay — the order created earlier with the same `Idempotency-Key`.", content: { application/json: { schema: { $ref: "#/components/schemas/OrderCreateResponse" } } } }
        "400":
          description: "`invalid_fulfillment` (not exactly one of address/pickup), `empty_order`, `invalid_qty`, `qty_too_large`, `invalid_variant_id` (not a UUID), `comment_too_long`, `invalid_idempotency_key`, `invalid_payment_method`, or malformed body."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`address_not_found`, `pickup_point_not_found`, or `variant_not_found`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409":
          description: "`insufficient_stock` — not enough stock at the chosen/fulfilling point (the message names the product and size, and how many are left); `product_unavailable` — a product was deactivated (message names it); `too_many_open_orders`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "502":
          description: "`payment_create_failed` — `online_card` only: the provider couldn't open a checkout session; the order was cancelled and its stock returned."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: "`payments_not_configured` — `online_card` only: online payment isn't available (e.g. `PAYMENTS_PROVIDER=bakai` before the bank integration exists). No order is created."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    get:
      tags: [Customer]
      summary: List the customer's own order history
      description: Newest first, each with its `items` attached.
      security: [{ customerBearerAuth: [] }]
      responses:
        "200":
          description: Order history.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/orders/{id}:
    get:
      tags: [Customer]
      summary: Get one of the customer's own orders
      description: "`{id}` may be either the order's UUID or its human-readable `order_number` (`COZY-YYYYMMDD-NNN`) — both are accepted, scoped to the authenticated customer."
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Order detail., content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`order_not_found` — missing, or belongs to a different customer (indistinguishable)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Customer]
      summary: Cancel one of the customer's own orders
      description: |
        Allowed only while the order is `placed` and not paid online
        (`payment_status` ≠ `paid`). The reserved stock is returned and, for
        an `online_card` order with a pending payment, the payment is
        cancelled too — all in one transaction. Staff get a Telegram note.
        `{id}` may be the UUID or `order_number`.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The cancelled order., content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`order_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: "`order_not_cancellable` — already confirmed/shipped/finished, or paid online (contact the store)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/cart:
    get:
      tags: [Customer]
      summary: Get the customer's server-side cart
      description: |
        Persisted server-side (not localStorage) so it's shared between the
        website and the mobile app for the same logged-in customer. Lines of
        deactivated products or with more pairs than any one store holds are
        still returned, with `available: false` — checkout would reject
        them with an error naming the product.
      security: [{ customerBearerAuth: [] }]
      responses:
        "200":
          description: Cart lines, enriched with the variant/product details needed to render a cart screen from this one response.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CartLine" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/cart/{variantId}:
    post:
      tags: [Customer]
      summary: Add a variant to the cart
      description: Upsert — adding an already-present variant increments its quantity rather than erroring. A line is capped at 20.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: variantId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 20 } } } } }
      responses:
        "204": { description: Added. }
        "400": { description: "`invalid_qty`, `qty_too_large`, `invalid_variant_id` (not a UUID).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`variant_not_found`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "`product_unavailable` — the product was deactivated.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    put:
      tags: [Customer]
      summary: Set a cart line's quantity
      description: A quantity of zero or less removes the line instead of failing.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: variantId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer } } } } }
      responses:
        "204": { description: "Updated (or removed, if quantity <= 0)." }
        "400": { description: "`qty_too_large` (> 20), `invalid_variant_id`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`cart_item_not_found` (only possible via a quantity > 0 update to a line that doesn't exist).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Customer]
      summary: Remove a cart line
      description: Removing a line that isn't there is a no-op, not an error.
      security: [{ customerBearerAuth: [] }]
      parameters: [{ name: variantId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Removed (or already absent). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------- Admin/Staff ---
  /admin/api/login:
    post:
      tags: [Admin — Staff]
      summary: Staff login
      description: |
        On success, sets an httpOnly/Secure `staff_session` cookie (12h TTL).
        Wrong password, unknown phone, and a deactivated account all return
        the same 401 — including matching response *timing*, since the
        handler always runs a bcrypt compare to avoid a phone-enumeration
        timing side-channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: "Logged in; see `Set-Cookie: staff_session=...`."
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }
          headers:
            Set-Cookie:
              schema: { type: string, example: "staff_session=...; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=43200" }
        "401":
          description: "`invalid_credentials` — wrong password, unknown phone, or deactivated staff (indistinguishable)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "429":
          description: "`too_many_attempts` — 5 attempts per phone, or `STAFF_LOGIN_MAX_PER_IP` (default 20) per client IP, per 15 min."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /admin/api/logout:
    post:
      tags: [Admin — Staff]
      summary: Staff logout
      description: Revokes the session server-side and clears the cookie. Safe to call with no/invalid cookie.
      security: [{ staffSessionCookie: [] }]
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, example: ok } } }

  /admin/api/staff:
    get:
      tags: [Admin — Staff]
      summary: List staff accounts
      description: "`password_hash` is never included — there's no field on the response DTO to leak it through."
      security: [{ staffSessionCookie: [] }]
      responses:
        "200":
          description: All staff accounts.
          content:
            application/json:
              schema:
                type: object
                properties: { items: { type: array, items: { $ref: "#/components/schemas/StaffAccount" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin — Staff]
      summary: Create a staff account
      description: Password is bcrypt-hashed before storage. `point_id` is required for `point_staff`, forbidden for `owner`/`manager`.
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateStaffRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccount" } } } }
        "400":
          description: "`invalid_phone`/`invalid_name`/`invalid_password`/`invalid_role`/`point_id_required`/`point_id_forbidden`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/api/staff/{id}:
    put:
      tags: [Admin — Staff]
      summary: Update a staff account
      description: |
        `password` is a pointer on the wire: omit it to leave the password
        unchanged, or supply a new one to rotate it (empty string rejected).
        Blocked with `409 last_owner` if this update would demote or
        deactivate the last active `owner` account.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStaffRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccount" } } } }
        "400":
          description: "`invalid_name`/`invalid_password`/`invalid_role`/`point_id_required`/`point_id_forbidden`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`last_owner` — this change would leave the shop with no active owner."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # ------------------------------------------------------- Admin/Catalog ---
  /admin/api/categories:
    post:
      tags: [Admin — Catalog]
      summary: Create a category
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/api/categories/{id}:
    put:
      tags: [Admin — Catalog]
      summary: Update a category
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin — Catalog]
      summary: Delete a category
      description: Hard delete. Blocked (`409 category_in_use`) if referenced by a product or a subcategory.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/api/products:
    post:
      tags: [Admin — Catalog]
      summary: Create a product
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/api/products/{id}:
    put:
      tags: [Admin — Catalog]
      summary: Update a product
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin — Catalog]
      summary: Delete (soft-delete) a product
      description: Sets `is_active = false` rather than a hard delete, so past `order_items` snapshots stay intact.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deactivated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/products/{id}/variants:
    post:
      tags: [Admin — Catalog]
      summary: Add a variant (size/color) to a product
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VariantInput" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Variant" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Product not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /admin/api/products/{id}/variants/{variantId}:
    put:
      tags: [Admin — Catalog]
      summary: Update a variant
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VariantInput" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Variant" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Variant not found, or doesn't belong to `id`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Admin — Catalog]
      summary: Delete a variant
      description: Hard delete. Blocked (`409`) if the variant has ever appeared in an order.
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Variant not found, or doesn't belong to `id`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/api/products/{id}/images:
    put:
      tags: [Admin — Catalog]
      summary: Replace a product's photo list
      description: |
        Writes `{object_key, sort_order}` rows into `product_images` —
        replaces the full set for the product. Does not talk to MinIO; call
        `POST /admin/api/media/upload` first for each photo to get its
        `object_key`, then call this endpoint.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ImageInput" }
      responses:
        "200":
          description: The product's new photo list.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProductImage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/stock/{variantId}/{pointId}:
    put:
      tags: [Admin — Catalog]
      summary: Set stock quantity for a variant at a point of sale
      description: |
        `owner`/`manager` may set stock at any point. `point_staff` may only
        set stock at their own point (`staff.point_id`) — a `point_staff`
        member targeting a different point gets `403 forbidden` even though
        `RequireRole` itself let the role through.
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties: { quantity: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/StockEntry" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Insufficient role, or `point_staff` targeting a point other than their own.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # --------------------------------------------------------- Admin/Media ---
  /admin/api/media/upload:
    post:
      tags: [Admin — Media]
      summary: Upload and normalize a product photo
      description: |
        Accepts one image file, normalizes it server-side and stores the
        result in MinIO; the returned `object_key` then goes into
        `PUT /admin/api/products/{id}/images` (or the admin product form).

        Processing:
        - the real format is detected by decoding the file (the part's
          `Content-Type` and file name are ignored) — JPEG, PNG and WebP
          are accepted, anything else is `400 unsupported_image`;
        - the shorter side must be at least 600 px (`400 image_too_small`);
          at most 50 megapixels (`400 image_too_large`);
        - EXIF orientation is applied, all metadata is stripped;
        - the image is fitted (contain) into a white 1:1 square with ~8%
          margins on every side; transparency becomes white;
        - two JPEG variants (quality 85) are stored:
          `products/<uuid>/full.jpg` (1200×1200) and
          `products/<uuid>/thumb.jpg` (400×400). If storing the second one
          fails, the first is deleted — no half-uploaded photos.

        **Variant naming convention.** `product_images.object_key` (and
        this response's `object_key`) is always the `full` key. The thumb
        key is derived by replacing the `/full.jpg` suffix with
        `/thumb.jpg`; a key that does not end in `/full.jpg` (legacy
        uploads, `products/<uuid>.<ext>`) has no variants and is used as is
        for both sizes. The API already applies this rule for you in
        `thumb_url` fields (product list, product detail images, cart) —
        clients should prefer `thumb_url` in grids/lists and `photo_url` /
        `url` on the product screen, rather than rebuilding URLs themselves.
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image, at most 10 MB.
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [object_key, url, thumb_url]
                properties:
                  object_key: { type: string, example: "products/3fae1c9e-2b0d-4c1e-9d55-0e6f5c1a7b21/full.jpg" }
                  url: { type: string, format: uri, description: "Public URL of the 1200×1200 variant." }
                  thumb_url: { type: string, format: uri, description: "Public URL of the 400×400 variant — the normalized result, for a preview." }
        "400":
          description: |
            Not multipart / no `file` part (`bad_request`, `file_required`),
            file over 10 MB (`file_too_large`), not a JPEG/PNG/WebP
            (`unsupported_image`), too small (`image_too_small`) or too large
            (`image_too_large`) resolution. `message` is Russian and meant to
            be shown to the admin as is.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: MinIO upload failed.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # -------------------------------------------------------- Admin/Points ---
  /admin/api/points:
    get:
      tags: [Admin — Points]
      summary: List points of sale
      description: Includes inactive points — unlike the (nonexistent) public catalog equivalent, the admin needs to see everything.
      security: [{ staffSessionCookie: [] }]
      responses:
        "200":
          description: All points of sale.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Point" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin — Points]
      summary: Create a point of sale
      description: Always created active — `is_active` isn't accepted on create, only on update.
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties: { name: { type: string }, address: { type: string } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Point" } } } }
        "400": { description: "`invalid_name`/`invalid_address`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/api/points/{id}:
    put:
      tags: [Admin — Points]
      summary: Update a point of sale
      description: Unlike create, `is_active` is required here — this is how a point gets deactivated/reactivated.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, is_active]
              properties: { name: { type: string }, address: { type: string }, is_active: { type: boolean } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/Point" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin — Points]
      summary: Delete a point of sale
      description: Blocked (`409 point_in_use`) if referenced by staff, stock, or orders — deactivate via update instead.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------- Admin/Orders ---
  /admin/api/orders:
    get:
      tags: [Admin — Orders]
      summary: List orders
      description: |
        `owner`/`manager` see every order. `point_staff` sees only orders at
        their own point (`point_id` silently forced to their own, overriding
        any `point_id` query param) — and, notably, an order that has no
        `point_id` yet (not yet assigned to a fulfilling point) is invisible
        to `point_staff`, visible only to `owner`/`manager`.
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [placed, confirmed, courier_assigned, delivered, cancelled] } }
        - { name: point_id, in: query, description: "Ignored for `point_staff` (see description).", schema: { type: string, format: uuid } }
        - { name: from, in: query, description: "RFC3339 or `YYYY-MM-DD`.", schema: { type: string } }
        - { name: to, in: query, description: "RFC3339 or `YYYY-MM-DD`.", schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated order list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        "400": { description: "`invalid_status`/`invalid_from`/`invalid_to`/`invalid_page`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/orders/{id}:
    get:
      tags: [Admin — Orders]
      summary: Get one order (admin view)
      description: "`{id}` may be the UUID or `order_number`. `point_staff` gets `403` for an order at a different point, or with no point assigned yet."
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Order detail., content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` — `point_staff` targeting an order outside their point."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/api/orders/{id}/status:
    put:
      tags: [Admin — Orders]
      summary: Change an order's status
      description: |
        Same point-scoping as `GET /admin/api/orders/{id}`. Only valid
        `order_status` transitions are accepted. Rules enforced by the
        orders service (so they hold for the HTML admin too):
        - only the `owner` may set `cancelled` (`403 cancel_forbidden`);
        - an `online_card` order can be `confirmed` only once
          `payment_status` = `paid` (`409 payment_not_completed`);
        - cancelling returns the order's stock to its point in the same
          transaction; cancelling a paid online order sets
          `refund_required`; a pending payment is cancelled;
        - every change is written to the order's `status_history`.
      security: [{ staffSessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [placed, confirmed, courier_assigned, delivered, cancelled] } }
      responses:
        "200": { description: Updated order., content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400":
          description: "`invalid_status_transition`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` — `point_staff` targeting an order outside their point; `cancel_forbidden` — only the owner may cancel."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`payment_not_completed` — confirming an `online_card` order that isn't paid."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # ------------------------------------------------------- Admin/Reports ---
  /admin/api/reports/sales:
    get:
      tags: [Admin — Reports]
      summary: Sales report (JSON)
      description: |
        Cancelled orders are fully excluded from every number in the report.
        `day`/`point` group at the order level; `product` groups at the
        line-item level (one order spanning several products counts once per
        product, but its `order_count` still dedupes by order id). An empty
        range or no matching orders returns a valid report with zero rows,
        not an error.
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, example: "2026-09-01" }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, example: "2026-09-15" }
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [day, product, point] } }
      responses:
        "200": { description: Aggregated report., content: { application/json: { schema: { $ref: "#/components/schemas/SalesReportResponse" } } } }
        "400": { description: "`from`/`to` malformed, `from > to`, or invalid `group_by`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/api/reports/sales.xlsx:
    get:
      tags: [Admin — Reports]
      summary: Sales report (Excel export)
      description: Same params and data as `GET /admin/api/reports/sales`, rendered as a downloadable `.xlsx` workbook.
      security: [{ staffSessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [day, product, point] } }
      responses:
        "200":
          description: "`.xlsx` workbook, `Content-Disposition: attachment; filename=\"sales_report.xlsx\"`."
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { description: "Same as the JSON variant.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------- Admin/Import ---
  /admin/products/import:
    post:
      tags: [Admin — Import]
      summary: Bulk product import from CSV or Excel
      description: |
        Deliberately **not** under `/admin/api/` — matches §8 of the ТЗ
        exactly. Format is detected from the filename extension and/or
        `Content-Type` and rejected with 400 before any parsing is attempted.
        A syntactically broken file (unparseable CSV/XLSX) fails the whole
        request with 400; a per-row validation problem (missing field, bad
        price, unknown category, ...) does NOT abort the batch — it's
        collected into `errors` and the next row is processed. A stock-upsert
        failure for one of a row's optional `stock:<pointId>` columns is
        recorded as a warning-style row error but still counts the row as
        imported, since the product/variant itself was created successfully.
      security: [{ staffSessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ".csv or .xlsx, columns (by header name, case-insensitive): name_ru, name_ky, category (slug or UUID), price, optionally brand/description_ru/description_ky/size/color/sku/price_override/stock:<pointId>."
      responses:
        "200": { description: "Import finished (possibly with per-row errors — check `errors`, not just the HTTP status).", content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "400":
          description: "`missing_file`, `unsupported_format`, or `invalid_multipart` — the whole file was rejected before any row was processed."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------ Payments ---
  /api/v1/payments/{provider}/callback:
    post:
      tags: [Payments]
      summary: Payment provider webhook
      description: |
        Called by the payment provider (not by the app). Authenticated by the
        `X-Webhook-Token` header (shared secret `BAKAI_WEBHOOK_TOKEN`; a
        header rather than `?token=` because Bakai may strip query strings —
        ТЗ §10). `{provider}` must be the active provider (`mock` or `bakai`).

        Idempotent: the payment row is locked `FOR UPDATE`; a repeated event
        is a no-op (`applied: false`). A `paid` event must carry the exact
        payment amount. `failed`/`cancelled` cancel the order and return its
        stock (only while the order is still `placed`). Contradictory events
        (e.g. `paid` after `failed`) are logged and ignored with `200` so the
        provider stops retrying.

        Body is provider-specific. For `mock`:
        `{"external_id": "mock_…", "status": "paid|failed|cancelled", "amount": 4990.5}`.
        For `bakai`: not implemented yet — authenticated calls get `503`.
      security: [{ webhookToken: [] }]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [mock, bakai] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Handled (or duplicate/ignored)., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackResult" } } } }
        "400":
          description: "`invalid_callback` (unparseable body), `amount_mismatch`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: "`invalid_webhook_token`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: "`payment_provider_not_found` (not the active provider) or `payment_not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: "`payments_not_configured` (bakai stub)."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /api/v1/payments/bakai/webhook:
    post:
      tags: [Payments]
      summary: Bakai webhook (ТЗ §6 path)
      description: Alias of `POST /api/v1/payments/bakai/callback` — same handler and responses.
      security: [{ webhookToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Handled., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackResult" } } } }
        "401": { description: "`invalid_webhook_token`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: "`payment_provider_not_found` — bakai isn't the active provider.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: "`payments_not_configured`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /api/v1/payments/mock/checkout/{externalId}:
    parameters:
      - { name: externalId, in: path, required: true, schema: { type: string, example: "mock_3f2a…" } }
    get:
      tags: [Payments]
      summary: Mock provider test checkout page (HTML)
      description: |
        Only registered while `PAYMENTS_PROVIDER=mock` (404 otherwise). This is
        the `payment_url` of an `online_card` order: an HTML page with
        "Оплатить" / "Отказ банка" / "Отменить оплату" buttons.
      responses:
        "200": { description: HTML page., content: { text/html: { schema: { type: string } } } }
        "404": { description: "`payment_not_found`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    post:
      tags: [Payments]
      summary: Simulate the bank's result (mock only)
      description: |
        Plays the bank: builds a signed mock callback for `result` and runs it
        through the same code path as `POST /api/v1/payments/mock/callback`,
        then renders the outcome with a link back to
        `/order/{orderNumber}/done`. Scriptable:
        `curl -X POST "$payment_url?result=paid"`.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { result: { type: string, enum: [paid, failed, cancelled] } } }
      parameters:
        - { name: result, in: query, required: false, schema: { type: string, enum: [paid, failed, cancelled] }, description: "Alternative to the form field." }
      responses:
        "200": { description: HTML result page., content: { text/html: { schema: { type: string } } } }
        "400": { description: "`invalid_result`, `amount_mismatch`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: "`payment_not_found`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  # -------------------------------------------------------------- System ---
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        "200": { description: Process is up. }

  /readyz:
    get:
      tags: [System]
      summary: Readiness probe
      description: Also pings the database.
      responses:
        "200": { description: Ready to serve traffic. }
        "503":
          description: "`db_unavailable`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  securitySchemes:
    staffSessionCookie:
      type: apiKey
      in: cookie
      name: staff_session
      description: Server-side staff session, set by `POST /admin/api/login`.
    webhookToken:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Shared secret for payment provider callbacks (`BAKAI_WEBHOOK_TOKEN`).
    customerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Customer access token from `POST /api/v1/auth/otp/verify` or
        `/api/v1/auth/refresh`. Required on every `Customer`-tagged endpoint
        (favorites, addresses, devices, orders, cart).

  responses:
    Unauthorized:
      description: Missing, invalid, or expired session/token.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Authenticated, but the staff role doesn't permit this action.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource doesn't exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Blocked by a foreign-key reference (e.g. still in use elsewhere).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BodyTooLarge:
      description: |
        `body_too_large` — request body over `MAX_BODY_BYTES` (default 1 MiB;
        multipart uploads: `MAX_UPLOAD_BYTES`, default 25 MiB). Applies to
        every endpoint.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      type: object
      description: The uniform shape every `apperr.AppError` serializes to.
      properties:
        code: { type: string, example: invalid_phone }
        message: { type: string, example: "укажите номер в формате +996XXXXXXXXX" }

    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: "JWT, 15 min TTL." }
        refresh_token: { type: string, description: "Opaque token, 30 day TTL." }

    VerifyOTPResponse:
      type: object
      properties:
        access_token: { type: string, description: "JWT, 15 min TTL." }
        refresh_token: { type: string, description: "Opaque token, 30 day TTL." }
        customer: { $ref: "#/components/schemas/CustomerProfile" }

    CustomerProfile:
      type: object
      required: [id, phone, lang, promo_push]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, example: "+996700123456" }
        name: { type: string, description: "Omitted until the customer sets it." }
        lang: { type: string, enum: [ru, ky], description: "Language order-status and promo pushes are sent in (default `ru`); also set by the website's language switch." }
        promo_push: { type: boolean, description: "Receives promo broadcasts (default true)." }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name_ru: { type: string }
        name_ky: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    CategoryInput:
      type: object
      required: [name_ru, name_ky, slug]
      properties:
        parent_id: { type: string, format: uuid, nullable: true }
        name_ru: { type: string }
        name_ky: { type: string }
        slug: { type: string }
        sort_order: { type: integer, default: 0 }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name_ru: { type: string }
        name_ky: { type: string }
        description_ru: { type: string, nullable: true }
        description_ky: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        base_price: { type: number, format: double }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [category_id, name_ru, name_ky, base_price]
      properties:
        category_id: { type: string, format: uuid }
        name_ru: { type: string }
        name_ky: { type: string }
        description_ru: { type: string, nullable: true }
        description_ky: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        base_price: { type: number, format: double, minimum: 0 }
        is_active: { type: boolean, nullable: true, description: "Defaults to true if omitted." }

    Variant:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        size: { type: string }
        color: { type: string }
        sku: { type: string, nullable: true }
        price_override: { type: number, format: double, nullable: true }

    VariantInput:
      type: object
      required: [size, color]
      properties:
        size: { type: string }
        color: { type: string }
        sku: { type: string, nullable: true }
        price_override: { type: number, format: double, nullable: true }

    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        object_key: { type: string }
        sort_order: { type: integer }
        color:
          type: string
          nullable: true
          description: "Null for a general product photo, or a product_variants.color string tying this photo to that specific color."

    ImageInput:
      type: object
      required: [object_key]
      properties:
        object_key: { type: string }
        sort_order: { type: integer, default: 0 }
        color:
          type: string
          nullable: true
          description: "Omit/null for a general product photo, or set to the exact variant color this photo belongs to."

    StockEntry:
      type: object
      properties:
        variant_id: { type: string, format: uuid }
        point_id: { type: string, format: uuid }
        quantity: { type: integer }
        updated_at: { type: string, format: date-time }

    StockPoint:
      type: object
      properties:
        point_id: { type: string, format: uuid }
        quantity: { type: integer }

    ProductListItem:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            photo_url:
              type: string
              description: "Primary (lowest sort_order) photo, or \"\" if the product has none."
            thumb_url:
              type: string
              description: "400×400 variant of the primary photo (see POST /admin/api/media/upload for the naming rule) — use this in grids. Same as photo_url for legacy photos without variants; \"\" if the product has none."

    ProductListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductListItem" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    ProductDetailResponse:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            images:
              type: array
              items: { $ref: "#/components/schemas/ProductPhoto" }
            variants:
              type: array
              items: { $ref: "#/components/schemas/VariantDetail" }

    ProductPhoto:
      type: object
      properties:
        url: { type: string, description: "Full-size (1200×1200) photo." }
        thumb_url: { type: string, description: "400×400 variant, e.g. for a thumbnail strip. Same as url for legacy photos without variants." }
        sort_order: { type: integer }
        color:
          type: string
          nullable: true
          description: "Null for a general product photo. When set, the client should prefer photos whose color matches the shopper's selected variant color, falling back to the null-color photos if that color has none."

    VariantDetail:
      allOf:
        - $ref: "#/components/schemas/Variant"
        - type: object
          properties:
            stock:
              type: array
              items: { $ref: "#/components/schemas/StockPoint" }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, nullable: true, example: "Дом" }
        address_text: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        is_default: { type: boolean }

    AddressInput:
      type: object
      required: [address_text]
      properties:
        label: { type: string, nullable: true }
        address_text: { type: string }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        is_default: { type: boolean, default: false }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string, example: "COZY-20260915-001" }
        customer_id: { type: string, format: uuid }
        address_id: { type: string, format: uuid, nullable: true }
        point_id: { type: string, format: uuid, nullable: true, description: "Delivery: the auto-selected fulfilling point. Pickup: the chosen point. Null until fulfillment is decided." }
        status: { type: string, enum: [placed, confirmed, courier_assigned, delivered, cancelled] }
        payment_method: { type: string, enum: [online_card, cash_on_delivery] }
        payment_status:
          type: string
          enum: [pending, paid, failed, cancelled, refunded]
          description: "Only present for `online_card` orders (omitted for `cash_on_delivery`). `failed`/`cancelled` orders are auto-cancelled."
        total_amount: { type: number, format: double, description: "What the customer pays: items + delivery_fee." }
        delivery_fee: { type: number, format: double, description: "Delivery charge included in total_amount (som); 0 for self-pickup and for orders placed before delivery was charged." }
        refund_required:
          type: boolean
          description: "true when money was taken for an order that ended up cancelled (paid then cancelled, or a late `paid` callback after the payment failed/expired) — staff must refund it."
        comment: { type: string, nullable: true, description: "Customer's note to the store (≤ 500 chars)." }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        status_history:
          type: array
          description: "Admin endpoints only (`GET /admin/api/orders/{id}`): status changes, oldest first."
          items: { $ref: "#/components/schemas/OrderStatusChange" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderStatusChange:
      type: object
      properties:
        from_status: { type: string, nullable: true, description: "null for the initial `placed` entry." }
        to_status: { type: string, enum: [placed, confirmed, courier_assigned, delivered, cancelled] }
        actor_type: { type: string, enum: [staff, customer, system], description: "`system` = payment callback / expiry job." }
        actor_staff_id: { type: string, format: uuid, nullable: true }
        actor_name: { type: string, nullable: true, description: Staff member's name. }
        note: { type: string, nullable: true, description: "e.g. `не оплачен вовремя`, `оплата отклонена`." }
        created_at: { type: string, format: date-time }

    OrderItem:
      type: object
      description: A price/size/color snapshot taken at checkout time — independent of later catalog edits.
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        product_name_snapshot: { type: string }
        size_snapshot: { type: string }
        color_snapshot: { type: string }
        quantity: { type: integer }
        price: { type: number, format: double }

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [variant_id, quantity]
            properties:
              variant_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        address_id: { type: string, format: uuid, nullable: true, description: "Delivery. Exactly one of address_id/pickup_point_id must be set." }
        pickup_point_id: { type: string, format: uuid, nullable: true, description: "Self-pickup. Exactly one of address_id/pickup_point_id must be set." }
        payment_method: { type: string, enum: [cash_on_delivery, online_card], default: cash_on_delivery }
        comment: { type: string, maxLength: 500, description: "Optional note to the store (delivery time, intercom code…). Blank = none." }

    OrderCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            payment_url: { type: string, format: uri, description: "`online_card` only: where to send the customer to pay." }

    PaymentCallbackResult:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, paid, failed, cancelled, refunded], description: Payment status after handling. }
        applied: { type: boolean, description: "false for a duplicate or ignored event." }
        order_cancelled: { type: boolean, description: "true when this event cancelled the order and returned its stock." }
        refund_required: { type: boolean, description: "true when this `paid` event arrived for an order/payment already cancelled — the order is flagged for a refund." }

    CartItem:
      type: object
      description: "Raw shape of a `cart_items` row — not what GET /api/v1/cart returns (see CartLine); this is the underlying storage record."
      properties:
        customer_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        qty: { type: integer }
        created_at: { type: string, format: date-time }

    CartLine:
      type: object
      description: One line of a customer's server-side cart, enriched with the current variant/product/primary-photo data (GET /api/v1/cart).
      properties:
        variant_id: { type: string, format: uuid }
        quantity: { type: integer }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        product_name_ky: { type: string }
        size: { type: string }
        color: { type: string }
        price: { type: number, format: double, description: "variant.price_override if set, else the product's base_price." }
        photo_url: { type: string, nullable: true, description: "Primary photo URL, or null if the product has none." }
        thumb_url: { type: string, nullable: true, description: "400×400 variant of the primary photo (same as photo_url for legacy photos), or null if the product has none." }
        is_active: { type: boolean, description: "false once the product was deactivated — the line can't be ordered." }
        in_stock: { type: integer, description: "Most pairs of this variant any one active store holds." }
        available: { type: boolean, description: "is_active and in_stock >= quantity — false means checkout would reject this line." }

    Point:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    StaffAccount:
      type: object
      description: "`password_hash` is never included — this is a response-only DTO."
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, manager, point_staff] }
        point_id: { type: string, format: uuid, nullable: true, description: "Set for `point_staff`, absent for owner/manager." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateStaffRequest:
      type: object
      required: [phone, password, name, role]
      properties:
        phone: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 72, description: "8 characters to 72 bytes (`invalid_password`)." }
        name: { type: string }
        role: { type: string, enum: [owner, manager, point_staff] }
        point_id: { type: string, format: uuid, nullable: true, description: "Required for point_staff, forbidden otherwise." }

    UpdateStaffRequest:
      type: object
      required: [name, role, is_active]
      properties:
        name: { type: string }
        role: { type: string, enum: [owner, manager, point_staff] }
        point_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }
        password: { type: string, format: password, nullable: true, minLength: 8, maxLength: 72, description: "Omit to leave unchanged; 8 characters to 72 bytes. A new password or is_active=false ends all of the account's sessions." }

    SalesReportResponse:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        group_by: { type: string, enum: [day, product, point] }
        rows: { type: array, items: { $ref: "#/components/schemas/SalesRow" } }

    SalesRow:
      type: object
      properties:
        key: { type: string, description: "Date, product name, or point name, depending on group_by." }
        order_count: { type: integer }
        item_count: { type: integer }
        revenue: { type: number, format: double }

    RowError:
      type: object
      properties:
        row: { type: integer, description: "1-based, counting the header as row 1 — matches what an admin sees opening the file in a spreadsheet app." }
        message: { type: string }

    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/RowError" } }

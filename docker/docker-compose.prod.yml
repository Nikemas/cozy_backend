# Production compose for cozy_backend (see docs/Cozy — Технический ТЗ для
# разработчика.md §11). Run from the repo root on the VPS:
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#
# This is distinct from docker/docker-compose.yml (local-dev-only:
# postgres+minio, no backend/caddy). Secrets live in a server-side .env,
# never committed — see .env.example for the full variable list.
#
# Normally driven by scripts/deploy.sh, which builds the backend image
# tagged with the git SHA (BACKEND_TAG) and can roll back to the previous
# tag. Third-party images are pinned to exact versions: bump them
# deliberately (read the release notes, then change the tag here), never
# via a surprise `latest` pull on a restart.

# Rotate container logs (json-file driver): without a limit a chatty
# container fills the VPS disk. 5 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    # Built on the VPS (no registry). deploy.sh sets BACKEND_TAG to the
    # commit SHA; a plain `docker compose up -d --build` by hand gets
    # :latest.
    image: cozy-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Covers HTTP_SHUTDOWN_TIMEOUT (10s default) with margin, so in-flight
    # requests finish before Docker sends SIGKILL.
    stop_grace_period: 30s
    # No healthcheck: the distroless image has no shell/curl to run one.
    # deploy.sh checks /readyz through Caddy instead.
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://cozy:${POSTGRES_PASSWORD}@postgres:5432/cozy?sslmode=disable
      # Internal Docker hostname — only the backend container needs to
      # resolve this. The admin's BROWSER instead needs MINIO_PUBLIC_ENDPOINT
      # (set in the server's .env to the Caddy-fronted media host, i.e.
      # MINIO_PUBLIC_ENDPOINT=media.cozy.erpsystemsales.com and
      # MINIO_PUBLIC_USE_SSL=true) — without it, photo URLs point at
      # "minio:9000", which the browser can't resolve, and no product photo
      # loads (uploads themselves go through the backend, POST
      # /admin/api/media/upload, over MINIO_ENDPOINT).
      MINIO_ENDPOINT: minio:9000
    # Firebase service-account key for push (FCM_CREDENTIALS_FILE=
    # /secrets/firebase-service-account.json in .env). The directory is
    # git-ignored; if it's missing Docker creates it empty and push stays
    # a logging no-op.
    volumes:
      - ../secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8080"

  postgres:
    # Major version pinned; minor updates of 16.x are drop-in. A major
    # upgrade needs pg_dump/restore (or pg_upgrade), never just a tag bump.
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozy -d cozy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cozy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    # Docker Hub's minio/minio now requires an authenticated pull —
    # quay.io is MinIO's own public mirror, no login needed. Pinned to the
    # release `latest` pointed at in 2026-09 (MinIO has stopped publishing
    # community images since, so `latest` will not move anyway).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    # `mc` ships inside the minio image; `mc ready local` is MinIO's own
    # compose example healthcheck. Informational only (nothing waits on
    # service_healthy for minio), so a false negative can't block a deploy.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Not published on the host: the browser reaches MinIO only through Caddy
    # at media.cozy.erpsystemsales.com (see docker/Caddyfile), which
    # terminates TLS. Port 9000 stays reachable inside the compose network
    # for the backend (MINIO_ENDPOINT=minio:9000) and for Caddy.
    expose:
      - "9000"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    # Only BAKAI_WEBHOOK_TOKEN is actually used (Caddyfile's {$BAKAI_WEBHOOK_TOKEN}
    # placeholder, injected as X-Webhook-Token on the Bakai webhook route —
    # see Caddyfile); the whole file is passed rather than picking one var
    # out because compose has no per-service env filtering.
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - minio

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

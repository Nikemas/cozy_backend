# Production compose for cozy_backend (see docs/Cozy — Технический ТЗ для
# разработчика.md §11). Run from the repo root on the VPS:
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#
# This is distinct from docker/docker-compose.yml (local-dev-only:
# postgres+minio, no backend/caddy). Secrets live in a server-side .env,
# never committed — see .env.example for the full variable list.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://cozy:${POSTGRES_PASSWORD}@postgres:5432/cozy?sslmode=disable
      # Internal Docker hostname — only the backend container needs to
      # resolve this. The admin's BROWSER instead needs MINIO_PUBLIC_ENDPOINT
      # (set in the server's .env to the Caddy-fronted media host, i.e.
      # MINIO_PUBLIC_ENDPOINT=media.cozy.erpsystemsales.com and
      # MINIO_PUBLIC_USE_SSL=true) — without it, presigned photo-upload URLs
      # point at "minio:9000", which the browser can't resolve, and every
      # upload in the admin panel fails.
      MINIO_ENDPOINT: minio:9000
    # Firebase service-account key for push (FCM_CREDENTIALS_FILE=
    # /secrets/firebase-service-account.json in .env). The directory is
    # git-ignored; if it's missing Docker creates it empty and push stays
    # a logging no-op.
    volumes:
      - ../secrets:/secrets:ro
    depends_on:
      - postgres
      - minio
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cozy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    # Docker Hub's minio/minio now requires an authenticated pull —
    # quay.io is MinIO's own public mirror, no login needed.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Not published on the host: the browser reaches MinIO only through Caddy
    # at media.cozy.erpsystemsales.com (see docker/Caddyfile), which
    # terminates TLS. Port 9000 stays reachable inside the compose network
    # for the backend (MINIO_ENDPOINT=minio:9000) and for Caddy.
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - minio

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

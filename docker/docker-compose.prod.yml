# Production compose for cozy_backend (see docs/Cozy — Технический ТЗ для
# разработчика.md §11). Run from the repo root on the VPS:
#
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#
# This is distinct from docker/docker-compose.yml (local-dev-only:
# postgres+minio, no backend/caddy). Secrets live in a server-side .env,
# never committed — see .env.example for the full variable list.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://cozy:${POSTGRES_PASSWORD}@postgres:5432/cozy?sslmode=disable
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - postgres
      - minio
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cozy
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    # Docker Hub's minio/minio now requires an authenticated pull —
    # quay.io is MinIO's own public mirror, no login needed.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Exposed directly (not proxied through Caddy) so presigned PUT/GET URLs
    # work without extra subdomain/path routing — fine for the test phase.
    # Move behind Caddy on its own subdomain + TLS before real production
    # traffic (see README note).
    ports:
      - "9000:9000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

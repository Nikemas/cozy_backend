# Cozy admin panel — Russian strings (fix/admin-i18n).
# Flat "key: value" pairs only (internal/i18n's loader is a small YAML
# subset: no nesting, lists or multi-line values). Every key must also
# exist in admin.ky.yaml — TestAdminLocaleKeySetsMatch checks it.
# Values with %s/%d are fmt.Sprintf formats ({{tf}} / tr.F).
# Plurals: <base>.one / .few / .many (tr.Plural).


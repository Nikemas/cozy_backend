# SEO: titles and meta descriptions (internal/web/seo.go).
seo.page.title: %s | Cozy
seo.home.title: Cozy — Бишкектеги бут кийим интернет-дүкөнү
seo.home.description: Cozy дүкөндөрүндө кроссовкалар, кеддер, ботинкалар жана башка бут кийимдер бар. Бишкек боюнча жеткирүү жана акысыз алып кетүү.
seo.category.title: %s — Бишкектен сатып алуу | Cozy
seo.category.description: Cozy интернет-дүкөнүндө %s: баалар, өлчөмдөр жана Бишкектеги дүкөндөрдө бар болушу. Жеткирүү жана өзү алып кетүү.
seo.product.title: %s — Бишкектен сатып алуу | Cozy
seo.product.description: %s — %s. Өлчөмдөр, түстөр жана Бишкектеги Cozy дүкөндөрүндө бар болушу. Жеткирүү жана өзү алып кетүү.
seo.branches.description: Бишкектеги Cozy дүкөндөрүнүн даректери: бут кийимди көрүп, кийип көрүү, буйрутманы алуу жана маршрут түзүү.
seo.page_about.description: Cozy — Бишкектеги ыңгайлуу бут кийим дүкөнү: дүкөндөрдө бар, жеткирүү, өзү алып кетүү, 14 күндүн ичинде алмаштыруу жана кайтаруу.
seo.page_contacts.description: Бишкектеги Cozy бут кийим дүкөнүнүн телефону, мессенджерлери, e-mail дареги жана иш убактысы.
seo.page_delivery.description: Бишкек боюнча жеткирүүнүн шарттары, Cozy дүкөндөрүнөн акысыз алып кетүү, төлөө ыкмалары, алмаштыруу жана кайтаруу.
seo.page_privacy.description: Cozy интернет-дүкөнү сатып алуучулардын жеке маалыматтарын кантип иштетет жана коргойт.
seo.page_terms.description: Cozy бут кийим интернет-дүкөнүнүн коомдук офертасы: буйрутма берүү, төлөө, жеткирүү, алмаштыруу жана кайтаруу.


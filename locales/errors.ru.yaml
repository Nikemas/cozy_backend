# Client-facing error texts — Russian (fix/api-error-i18n).
#
#   err.<code>[.<variant>]  messages of internal/apperr error codes; the
#                           JSON "message" for Accept-Language: ru is the
#                           code's own Message, which TestRussianError-
#                           MessagesMatchCode keeps identical to this file.
#   import.*                per-row messages of the product import report.
#
# {name} is a placeholder filled by the code (WithParams / catalog import).
# Same keys as errors.ky.yaml (TestErrorLocalesHaveSameKeys).

